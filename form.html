<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="thankyou.html" method="post">
        <table border="0">
            <tr>
                <td>Name</td>
                <td><input type="text" require name="fname" id="" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Surname</td>
                <td><input type="text" name="lname" id=""></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number" name="" id=""></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="" id=""></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea cols="20" rows="7" placeholder="Adress..." name="Add" id=""></textarea></td>
            </tr>
            <tr>
                <td>DOB</td>
                <!-- <td><input type="date" name="" id=""></td> -->
                 <!-- <td><input type="datetime-local" name="" id=""></td> -->
                  <!-- <td><input type="week" name="" id=""></td> -->
                   <!-- <td><input type="time" name="" id=""></td> -->
                    <td><input type="month" name="" id=""></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>Male <input type="radio" name="gender" value="male">
                    Female <input type="radio" name="gender" value="female">
                    Other <input type="radio" name="gender" value="other">
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    Cricket <input type="checkbox" name="hobby" id="" value="cricket">
                    Football <input type="checkbox" name="hobby" id="" value="football">
                    Basketball <input type="checkbox" name="hobby" id="" value="basketball">
                </td>
            </tr>
            <tr>
                <td>City</td>
                <td><select name="city" id="">
                    <option value="" selected disabled>Select city</option>
                    <optgroup label="Gujarat">
                        <option value="surat">Surat</option>
                        <option disabled value="ahmedabad">Ahmedabad</option>
                        <option value="vadodara">Vadodara</option>
                        <option value="bharuch">Bharuch</option>
                    </optgroup>
                    <optgroup label="maharasta" disabled>
                        <option value="Pune">Pune</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Nagpur">Nagpur</option>
                        <option value="navapur">navapur</option>
                    </optgroup>
                </select></td>
            </tr>
            <tr>
                <td>Attach file</td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td>Color</td>
                <td><input type="color" name="color" id=""></td>
            </tr>
            <tr>
                <td>Salary</td>
                <td><input type="range"  name="salary" id=""></td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
                <td><input type="reset" name="" id=""></td>
            </tr>
        </table>
    </form>



</body>
</html>
